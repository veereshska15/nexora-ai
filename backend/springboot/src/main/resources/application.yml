server:
  port: ${SPRING_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: nexora-enterprise-backend
  profiles:
    active: ${SPRING_PROFILE:dev}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:nexora_db}
    username: ${POSTGRES_USER:nexora_admin}
    password: ${POSTGRES_PASSWORD:nexora_secure_password_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:nexora_redis_password_2026}

# Custom Security & JWT Configuration
nexora:
  security:
    jwt:
      secret: ${NEXORA_SECRET_KEY:nexora-super-secret-jwt-signing-key-change-in-production-min-32-chars!}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}             # 24 hours
      refresh-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:604800000} # 7 days
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:5173,http://localhost:8000}

# Spring Boot Actuator Monitoring Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
