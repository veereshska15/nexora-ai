version: '3.8'

# ==============================================================================
# NEXORA AI — LOCAL INFRASTRUCTURE DOCKER COMPOSE ORCHESTRATION
# Services: PostgreSQL (pgvector), Redis, Qdrant Vector DB, MLflow, FastAPI, Spring Boot
# ==============================================================================

networks:
  nexora-network:
    driver: bridge
    name: nexora-network

volumes:
  nexora_postgres_data:
  nexora_redis_data:
  nexora_qdrant_data:
  nexora_mlflow_data:

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 with pgvector extension support
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexora-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora_db}
      POSTGRES_USER: ${POSTGRES_USER:-nexora_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora_secure_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - nexora_postgres_data:/var/lib/postgresql/data
      - ./database/schemas/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql
    networks:
      - nexora-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexora_admin} -d ${POSTGRES_DB:-nexora_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Redis 7 for Session Management, Rate Limiting & Async Queue
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nexora-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-nexora_redis_password_2026}
    ports:
      - "6379:6379"
    volumes:
      - nexora_redis_data:/data
    networks:
      - nexora-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. Qdrant High-Performance Vector Database
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: nexora-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - nexora_qdrant_data:/qdrant/storage
    networks:
      - nexora-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 4. MLflow Experiment Tracking & Model Registry Server
  # ----------------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.0
    container_name: nexora-mlflow
    restart: always
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - nexora_mlflow_data:/mlflow
    networks:
      - nexora-network

  # ----------------------------------------------------------------------------
  # 5. Python FastAPI AI Engine Microservice
  # ----------------------------------------------------------------------------
  fastapi:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.fastapi
    container_name: nexora-fastapi
    restart: always
    ports:
      - "8000:8000"
    environment:
      - NEXORA_ENV=${NEXORA_ENV:-development}
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - nexora-network

  # ----------------------------------------------------------------------------
  # 6. Java Spring Boot Enterprise Service
  # ----------------------------------------------------------------------------
  springboot:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.springboot
    container_name: nexora-springboot
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nexora_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-nexora_admin}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-nexora_secure_password_2026}
      - SPRING_REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexora-network
